services:
  postgres:
    image: postgres:16-alpine
    container_name: examguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - examguard_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: examguard_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - examguard_redisdata:/data

volumes:
  examguard_pgdata:
  examguard_redisdata: